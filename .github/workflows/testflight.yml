name: Tempo TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Apple görsel kataloğunu hazırla
        run: |
          set -euo pipefail
          while IFS= read -r -d '' FILE; do
            TEMP_FILE="${FILE%.png}.apple.png"
            sips -s format png "$FILE" --out "$TEMP_FILE" >/dev/null
            mv "$TEMP_FILE" "$FILE"
          done < <(find ios/TempoHealth/Sources/Assets.xcassets -name '*.png' -print0)
          sips -g pixelWidth -g pixelHeight ios/TempoHealth/Sources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png

      - name: App Store imzalama dosyalarını kur
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          for VALUE in "$CERTIFICATE_BASE64" "$CERTIFICATE_PASSWORD" "$PROVISIONING_PROFILE_BASE64"; do
            test -n "$VALUE"
          done

          CERTIFICATE_PATH="$RUNNER_TEMP/TempoDistribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/TempoAppStore.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/TempoAppStore.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/tempo-testflight.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          printf '%s' "$PROVISIONING_PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: App Store arşivini oluştur
        run: |
          set -euo pipefail
          # Use the source build version plus the workflow run/attempt sequence.
          # The attempt component makes a retry unique even if an earlier
          # attempt uploaded successfully before the workflow later failed.
          SOURCE_BUILD_NUMBER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' ios/TempoHealth/Info.plist)
          BUILD_SEQUENCE=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          BUILD_NUMBER="${SOURCE_BUILD_NUMBER}.${BUILD_SEQUENCE}"
          if [[ ! "$BUILD_NUMBER" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "Generated invalid CFBundleVersion: $BUILD_NUMBER"
            exit 1
          fi
          echo "TestFlight build number: $BUILD_NUMBER"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ios/TempoHealth/Info.plist
          WRITTEN_BUILD_NUMBER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' ios/TempoHealth/Info.plist)
          test "$WRITTEN_BUILD_NUMBER" = "$BUILD_NUMBER"
          xcodebuild \
            -project ios/TempoHealth/TempoHealth.xcodeproj \
            -scheme TempoHealth \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Tempo.xcarchive" \
            DEVELOPMENT_TEAM=DV675SBH9Q \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            archive
          ARCHIVED_BUILD_NUMBER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$RUNNER_TEMP/Tempo.xcarchive/Products/Applications/Tempo.app/Info.plist")
          echo "Archived TestFlight build number: $ARCHIVED_BUILD_NUMBER"
          test "$ARCHIVED_BUILD_NUMBER" = "$BUILD_NUMBER"

      - name: TestFlight IPA dosyasını dışa aktar
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>DV675SBH9Q</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>com.apitempo.tempohealth</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
            <key>stripSwiftSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Tempo.xcarchive" \
            -exportPath "$RUNNER_TEMP/TempoExport" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: TestFlight'a yükle
        env:
          APPLE_ID: ${{ secrets.APP_STORE_CONNECT_APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_STORE_CONNECT_APP_PASSWORD }}
        run: |
          set -euo pipefail
          IPA_PATH="$(find "$RUNNER_TEMP/TempoExport" -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          test -n "$APPLE_ID"
          test -n "$APP_SPECIFIC_PASSWORD"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --username "$APPLE_ID" \
            --password "$APP_SPECIFIC_PASSWORD" \
            --team-id DV675SBH9Q

      - name: Arşiv raporunu sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tempo-TestFlight-export
          path: |
            ${{ runner.temp }}/TempoExport
            ${{ runner.temp }}/ExportOptions.plist
          if-no-files-found: ignore
          retention-days: 7

      - name: Geçici anahtar zincirini temizle
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
