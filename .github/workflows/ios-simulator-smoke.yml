name: iOS Simulator Smoke Test

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-simulator-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-smoke:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Report Xcode and simulator runtimes
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devices available

      - name: Run backend regression tests
        run: node --test worker/test/*.test.js

      - name: Run production sleep aggregation regressions
        run: |
          set -euo pipefail
          swiftc ios/TempoHealth/Sources/TempoSleepAggregation.swift ios/HealthRegressionTests/main.swift -o "$RUNNER_TEMP/health-regressions"
          "$RUNNER_TEMP/health-regressions"

      - name: Select an iPhone simulator
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          test -n "$DEVICE_ID"
          echo "TEMPO_SIMULATOR_ID=$DEVICE_ID" >> "$GITHUB_ENV"

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/TempoHealth/TempoHealth.xcodeproj \
            -scheme TempoHealth \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$TEMPO_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/TempoSimulatorBuild" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=YES \
            build-for-testing

      - name: Install and launch on an iPhone simulator
        run: |
          set -euo pipefail
          DEVICE_ID="$TEMPO_SIMULATOR_ID"
          test -n "$DEVICE_ID"
          echo "Using iPhone simulator $DEVICE_ID"

          APP_PATH="$RUNNER_TEMP/TempoSimulatorBuild/Build/Products/Debug-iphonesimulator/Tempo.app"
          test -d "$APP_PATH"

          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          LAUNCH_OUTPUT="$(xcrun simctl launch --terminate-running-process "$DEVICE_ID" com.apitempo.tempohealth)"
          echo "$LAUNCH_OUTPUT"
          [[ "$LAUNCH_OUTPUT" =~ [0-9]+ ]]

          xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/Tempo-simulator-launch.png"

      - name: Run user-flow UI tests on the iPhone simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/TempoHealth/TempoHealth.xcodeproj \
            -scheme TempoHealth \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$TEMPO_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/TempoSimulatorBuild" \
            -resultBundlePath "$RUNNER_TEMP/TempoUITests.xcresult" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            test-without-building

      - name: Export UI test screenshots
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/TempoUITests.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/TempoUITests.xcresult" --output-path "$RUNNER_TEMP/TempoUITestScreenshots"
          fi

      - name: Keep UI test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tempo-ios-ui-screenshots
          path: ${{ runner.temp }}/TempoUITestScreenshots
          if-no-files-found: ignore
          retention-days: 7

      - name: Keep simulator launch screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tempo-ios-simulator-launch
          path: ${{ runner.temp }}/Tempo-simulator-launch.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Keep UI test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tempo-ios-ui-test-results
          path: ${{ runner.temp }}/TempoUITests.xcresult
          if-no-files-found: ignore
          retention-days: 7

