name: Tempo Strain Core Checks

on:
  workflow_dispatch:
    inputs:
      runner:
        description: macOS kontrol çalıştırıcısı
        type: choice
        default: macos-26
        options: [macos-26, macos-15, macos-15-intel]

permissions:
  contents: read

jobs:
  math:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 26 SDK seçimi
        run: |
          set -euo pipefail
          XCODE_PATH="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)"
          test -n "$XCODE_PATH"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"
      - name: Swift 6 efor motoru kontrolü
        run: |
          set -euo pipefail
          swiftc -swift-version 6 -D STRAIN_CORE_TESTS \
            ios/TempoHealth/Sources/SportArchetypes.swift \
            ios/TempoHealth/Sources/Workout.swift \
            ios/TempoHealth/Sources/HeartRateZoneInference.swift \
            ios/TempoHealth/Sources/RecoveryLoadAnalysis.swift \
            ios/TempoHealth/Sources/UniversalStrainEngine.swift \
            ios/TempoHealth/Sources/CrossSportAI.swift \
            ios/StrainRegressionTests/main.swift \
            -o "$RUNNER_TEMP/tempo-strain-checks"
          "$RUNNER_TEMP/tempo-strain-checks"
      - name: iOS kaynaklarını tür denetiminden geçir (simülatör başlatılmaz)
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          SOURCES=()
          while IFS= read -r -d '' FILE; do SOURCES+=("$FILE"); done < <(find ios/TempoHealth/Sources -maxdepth 1 -name '*.swift' -print0)
          xcrun swiftc -typecheck -parse-as-library -swift-version 5 -module-name TempoHealth -sdk "$SDK" -target arm64-apple-ios17.0-simulator "${SOURCES[@]}"
          plutil -lint ios/TempoHealth/TempoHealth.xcodeproj/project.pbxproj ios/TempoHealth/Sources/en.lproj/Localizable.strings ios/TempoHealth/Sources/tr.lproj/Localizable.strings
      - name: Otomatik antrenman algılama senaryoları
        run: |
          set -euo pipefail
          swiftc -swift-version 6 ios/TempoHealth/Sources/PassiveWorkoutEngine.swift ios/TempoHealth/Sources/WorkoutDetectionEngine.swift ios/TempoHealth/Sources/TempoWorkoutLedger.swift ios/DetectionRegressionTests/main.swift -o "$RUNNER_TEMP/tempo-detection-checks"
          "$RUNNER_TEMP/tempo-detection-checks"
          plutil -lint ios/TempoHealth/Info.plist ios/TempoHealth/Sources/en.lproj/InfoPlist.strings ios/TempoHealth/Sources/tr.lproj/InfoPlist.strings
      - name: Koç bağlamı ve izin kontrolleri
        run: node --test worker/test/coach-social.test.js worker/test/athletic-context.test.js worker/test/passive-social.test.js worker/test/passive-social-live.test.js worker/test/notification-inbox.test.js
      - name: Harita araması yaşam döngüsü
        run: |
          set -euo pipefail
          swiftc -swift-version 6 ios/TempoHealth/Sources/FacilitySearchLifecycle.swift ios/MapRegressionTests/main.swift -o "$RUNNER_TEMP/tempo-map-checks"
          "$RUNNER_TEMP/tempo-map-checks"

