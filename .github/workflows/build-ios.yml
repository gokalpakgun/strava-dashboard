name: Tempo iPhone Signed IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/build-ios.yml"

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Uygulama ikonunu hazırla
        run: |
          ICON="ios/TempoHealth/Sources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          sips -z 1024 1024 "$ICON" --out "$ICON"

      - name: Apple imzalama dosyalarını kur
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DEVELOPMENT_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DEVELOPMENT_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_DEVELOPMENT_PROFILE_BASE64 }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/TempoHealth-development.p12"
          PROFILE_PATH="$RUNNER_TEMP/Tempo_Health_Development.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/Tempo_Health_Development.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/tempo-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          printf '%s' "$PROVISIONING_PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH"             -P "$CERTIFICATE_PASSWORD"             -A             -t cert             -f pkcs12             -k "$KEYCHAIN_PATH"
          security set-key-partition-list             -S apple-tool:,apple:,codesign:             -s             -k "$KEYCHAIN_PASSWORD"             "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: iPhone uygulamasını imzalı derle
        run: |
          xcodebuild             -project ios/TempoHealth/TempoHealth.xcodeproj             -scheme TempoHealth             -configuration Release             -sdk iphoneos             -destination "generic/platform=iOS"             -derivedDataPath "$RUNNER_TEMP/TempoDerivedData"             DEVELOPMENT_TEAM=DV675SBH9Q             CODE_SIGN_STYLE=Manual             CODE_SIGN_IDENTITY="Apple Development"             PROVISIONING_PROFILE="$PROFILE_UUID"             OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"             build

      - name: HealthKit imzasını doğrula
        run: |
          APP_PATH="$RUNNER_TEMP/TempoDerivedData/Build/Products/Release-iphoneos/Tempo.app"
          codesign --verify --deep --strict "$APP_PATH"
          codesign -d --entitlements :- "$APP_PATH" > "$RUNNER_TEMP/Tempo-entitlements.plist" 2>/dev/null
          plutil -convert xml1 "$RUNNER_TEMP/Tempo-entitlements.plist"
          /usr/libexec/PlistBuddy             -c "Print :com.apple.developer.healthkit"             "$RUNNER_TEMP/Tempo-entitlements.plist"

      - name: İmzalı IPA paketini hazırla
        run: |
          APP_PATH="$RUNNER_TEMP/TempoDerivedData/Build/Products/Release-iphoneos/Tempo.app"
          EXECUTABLE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")"
          test -n "$EXECUTABLE_NAME"
          test -f "$APP_PATH/$EXECUTABLE_NAME"
          mkdir -p "$RUNNER_TEMP/TempoIPA/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/TempoIPA/Payload/"
          ditto -c -k --sequesterRsrc --keepParent             "$RUNNER_TEMP/TempoIPA/Payload"             "$RUNNER_TEMP/Tempo-signed.ipa"

      - name: İmzalı IPA dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: Tempo-iPhone-signed
          path: ${{ runner.temp }}/Tempo-signed.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Geçici anahtar zincirini temizle
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
