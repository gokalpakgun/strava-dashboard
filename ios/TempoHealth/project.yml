name: TempoHealth
options:
  bundleIdPrefix: com.apitempo
  deploymentTarget:
    iOS: "17.0"
targets:
  TempoHealth:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Info.plist
    entitlements:
      path: TempoHealth.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.apitempo.tempohealth
        PRODUCT_NAME: Tempo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: TempoHealth.entitlements
        GENERATE_INFOPLIST_FILE: NO
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
